# Заглушка до DQ-6 роли 2: тексты каналов чувствительности и следствия по направлению фактора.
# Когда роль 2 добавит каналы в config/factors.yaml, этот файл удаляется.
# Следствие читается как продолжение «Для вас: …», без чисел. Описывает, что происходит с каналом,
# а не оценивает: знак выгоды компании определяет профиль, а не этот файл.
#   text — как в Exposure.channels; when — признак-основание канала (часть Exposure.because до «=» или «:»).

key_rate:
  debt_cost:
    text: стоимость кредитов
    when: products.LOA
    up: процентная нагрузка вырастет
    down: процентная нагрузка снизится
    flat: процентная нагрузка не снизится
  mortgage_demand:
    text: спрос на ипотеку
    when: sector
    up: спрос на ипотеку ослабнет
    down: спрос на ипотеку оживится
    flat: спрос на ипотеку не восстанавливается
  cash_yield:
    text: доход на свободные деньги
    when: products.DEP
    up: доходность размещения вырастет
    down: доходность размещения снизится
    flat: доходность размещения сохраняется

inflation:
  construction_cost:
    text: рост стоимости строительства
    when: suppliers.construction_materials
    up: стоимость строительства вырастет быстрее
    down: стоимость строительства будет расти медленнее
    flat: стоимость строительства продолжит расти прежними темпами
  operating_costs:
    text: рост операционных издержек
    when: null
    up: операционные издержки вырастут быстрее
    down: операционные издержки будут расти медленнее
    flat: операционные издержки продолжат расти прежними темпами

credit_availability:
  project_financing:
    text: стоимость проектного финансирования
    when: products.LOA
    up: условия проектного финансирования смягчатся
    down: условия проектного финансирования ужесточатся
    flat: условия проектного финансирования не изменятся
  working_capital:
    text: доступ к оборотному капиталу
    when: products.LOA
    up: привлечь оборотное финансирование станет проще
    down: привлечь оборотное финансирование станет сложнее
    flat: условия оборотного финансирования не изменятся

mortgage_housing:
  mortgage_demand:
    text: спрос на жильё в ипотеку
    when: sector
    up: спрос на жильё в ипотеку вырастет
    down: спрос на жильё в ипотеку снизится
    flat: спрос на жильё в ипотеку останется слабым
  buyer_payment:
    text: платёжеспособность покупателей жилья
    when: sector
    up: платёжеспособность покупателей улучшится
    down: платёжеспособность покупателей ухудшится
    flat: платёжеспособность покупателей не изменится

usd_rub:
