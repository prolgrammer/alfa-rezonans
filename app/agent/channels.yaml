    flat: стоимость импортных закупок не изменится
  fx_revenue:
    text: валютная выручка
    when: foreign_trade
    up: рублёвая оценка валютной выручки вырастет
    down: рублёвая оценка валютной выручки снизится
    flat: рублёвая оценка валютной выручки не изменится

eur_rub:
  import_costs:
    text: стоимость импортных закупок
    when: foreign_trade
    up: импортные закупки подорожают
