# Модели и задачи шлюза (ML-1). Список моделей ограничен белым списком в app/llm/config.py.
# price — ₽ за 1000 токенов; {folder} в uri подставляется из LLM_FOLDER_ID.

providers:
  yandex:
    base_url: https://ai.api.cloud.yandex.net/v1
    concurrency: 4 # квота AI Studio — 5 одновременных запросов, при 8 приходит 429
    interactive_slots: 1
    timeout_s: 60
    headers:
      x-data-logging-enabled: "false"

models:
  gemma-4-26b-a4b:
    # URI и цена — уточнить: probe (задача 5) и тарифы AI Studio
    provider: yandex
    uri: "gpt://{folder}/gemma-4-26b-a4b/latest"
    context: 131072
    price: {in: 0.50, out: 1.20}
    caps: [json_schema, json_object, tools]
  glm-5.3-flash:
    # URI и цена — уточнить: probe (задача 5) и тарифы AI Studio
    provider: yandex
    uri: "gpt://{folder}/glm-5.3-flash/latest"
    context: 131072
    price: {in: 0.50, out: 1.20}
    caps: [json_schema, json_object, tools]
  qwen3.6-35b-a3b:
    provider: yandex
    uri: "gpt://{folder}/qwen3.6-35b-a3b/latest"
    context: 262144
    price: {in: 0.20, out: 0.30}
    # картинки — по документации AI Studio (Base64); проверит probe
    caps: [json_schema, json_object, tools, vision]
    # без reasoning_effort Qwen3.6 тратит max_tokens на рассуждения и отдаёт пустой content
    reasoning_off: reasoning_effort
  deepseek-v4.1-flash:
    # deepseek-v4-flash в AI Studio — предыдущая версия V4, её отключают 15.11.2026
    provider: yandex
    uri: "gpt://{folder}/deepseek-v4.1-flash/latest"
    context: 1048576
    price: {in: 0.30, out: 0.50}
    caps: [json_schema, json_object, tools]
  qwen3-vl-30b-a3b-instruct:
    # URI и цена — уточнить: probe (задача 5) и тарифы AI Studio
    provider: yandex
    uri: "gpt://{folder}/qwen3-vl-30b-a3b-instruct/latest"
    context: 131072
    price: {in: 0.50, out: 1.20}
    caps: [json_object, vision]
  kimi-k2.6:
    # URI и цена — уточнить: probe (задача 5) и тарифы AI Studio
    provider: yandex
    uri: "gpt://{folder}/kimi-k2.6/latest"
    context: 262144
    price: {in: 0.50, out: 1.20}
    caps: [json_schema, json_object, tools]

# temperature и max_tokens — стартовые, их уточнит бенчмарк (задача 21).
# essential: false у всех: при 100% лимита продукт целиком переходит на разбор без LLM (ML-3).
tasks:
  news_filter:
    {model: gemma-4-26b-a4b, fallback: [qwen3.6-35b-a3b], temperature: 0.1, max_tokens: 600, essential: false}
  event_card:
    {model: qwen3.6-35b-a3b, fallback: [glm-5.3-flash], temperature: 0.1, max_tokens: 1500, essential: false}
  rank_judge:
    {model: gemma-4-26b-a4b, fallback: [qwen3.6-35b-a3b], temperature: 0.1, max_tokens: 800, essential: false}
  bank_theses:
    {model: deepseek-v4.1-flash, fallback: [qwen3.6-35b-a3b], temperature: 0.1, max_tokens: 4000, essential: false}
  chart_read:
    {model: qwen3-vl-30b-a3b-instruct, fallback: [], temperature: 0.1, max_tokens: 800, essential: false}
  insight_plan:
    {model: glm-5.3-flash, fallback: [kimi-k2.6], temperature: 0.2, max_tokens: 1500, reasoning: true, essential: false}
  insight_write:
    {model: glm-5.3-flash, fallback: [kimi-k2.6], temperature: 0.3, max_tokens: 2500, strategy: tools, essential: false}
  insight_critic:
    {model: deepseek-v4.1-flash, fallback: [kimi-k2.6], temperature: 0.1, max_tokens: 1500, reasoning: true, essential: false}
  chat:
    {model: qwen3.6-35b-a3b, fallback: [glm-5.3-flash], temperature: 0.2, max_tokens: 900, strategy: tools, essential: false}
  profile_text:
    {model: qwen3.6-35b-a3b, fallback: [gemma-4-26b-a4b], temperature: 0.1, max_tokens: 1000, essential: false}
  eval_judge:
    {model: kimi-k2.6, fallback: [deepseek-v4.1-flash], temperature: 0.0, max_tokens: 800, essential: false}
  # модель задаёт вызывающий (orientir llm probe); 300 токенов хватает, чтобы увидеть рассуждения
  probe:
    {model: null, fallback: [], temperature: 0.0, max_tokens: 300, essential: false}
